<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EngStep – Học tiếng Anh từng bước</title>
  <meta name="description" content="Học 3.000 từ vựng tiếng Anh thông dụng từ A1 đến B2, luyện Nghe – Nói – Đọc – Viết, ôn tập ngắt quãng. Miễn phí, dùng được offline.">
  <meta name="theme-color" content="#0f9d6e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Áp dụng giao diện sáng/tối và cỡ chữ ngay khi tải để tránh nháy màn hình
    try {
      const s = JSON.parse(localStorage.getItem('engstep.progress') || '{}').settings || {};
      if (s.theme && s.theme !== 'auto') document.documentElement.dataset.theme = s.theme;
      if (s.fontSize) document.documentElement.dataset.font = s.fontSize;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Bỏ qua đến nội dung</a>
  <header class="topbar">
    <a class="brand" href="#/"><img src="icons/icon.svg" alt="" width="32" height="32"><span>EngStep</span></a>
    <nav class="topnav" id="topnav"></nav>
    <div class="topbar-right" id="topbar-right"></div>
  </header>
  <main id="main" tabindex="-1">
    <div class="boot">
      <div class="spinner"></div>
      <p>Đang tải bài học…</p>
    </div>
  </main>
  <nav class="bottomnav" id="bottomnav" aria-label="Điều hướng chính"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">Trang web cần bật JavaScript để hoạt động.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
